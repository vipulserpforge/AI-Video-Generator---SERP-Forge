      // Generated from 02_audio/transcript.json. Each word turns white on its own start time.
      const tl = gsap.timeline({ paused: true });

        const open = parseFloat(g.dataset.open), close = parseFloat(g.dataset.close);
        tl.set(g, { visibility: "visible" }, open);

          if (w.classList.contains("key")) {
            tl.to(w, { color: "#0A0E0D", duration: 0.08, ease: "none" }, t);
            tl.to(w.querySelector(".kb"), { scaleX: 1, duration: 0.15, ease: "expo.out" }, t);
          } else {
            tl.to(w, { color: "#FFFFFF", duration: 0.08, ease: "none" }, t);
          }
        });
        tl.to(g, { opacity: 0, duration: 0.12, ease: "power2.in" }, close - 0.12);
        tl.set(g, { opacity: 0, visibility: "hidden" }, close);
      });
      window.__timelines["subs"] = tl;
